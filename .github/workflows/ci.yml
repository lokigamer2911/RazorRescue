name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint, Audit, Tests, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --check src/index.js
      - run: node --check src/routes/api.js
      - run: node --check src/services/openrouter.js
      - run: node --check src/services/database.js
      - run: node --check src/services/simulation.js
      - run: node --check src/middleware/security.js
      - run: node --check scripts/evaluate.mjs
      # Unit tests for the deterministic AI core (bun:test, zero network).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
      # Honest-metrics gate: the eval harness must stay within documented bounds.
      - run: |
          bun scripts/evaluate.mjs > /tmp/eval.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/eval.json", "utf8"));
            const d = r.patternDetection;
            const pass =
              parseFloat(d.precision) >= 80 && parseFloat(d.recall) >= 85 &&
              parseFloat(d.bankMatchRate) === 100 && r.grounding.numberMismatchesVsRawData === 0 &&
              r.throughput.msFor100kTransactions < 50;
            if (!pass) { console.error("Eval gate failed:", JSON.stringify(d)); process.exit(1); }
            console.log("✅ Eval gate passed: precision", d.precision, "recall", d.recall, "bankMatch", d.bankMatchRate);
          '

  frontend:
    name: Frontend — Install, Build, Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # The frontend is installed with bun (bun.lock is the source of truth).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in code
        run: |
          # Matches real key formats only — input placeholders like "sk_live_…" are not secrets.
          if grep -rE "sk-or-v1-[A-Za-z0-9]{10,}|sk_live_[A-Za-z0-9]{10,}|sk_test_[A-Za-z0-9]{10,}|rzp_(live|test)_[A-Za-z0-9]{10,}|AIza[0-9A-Za-z_-]{30,}|password[[:space:]]*=" --include="*.js" --include="*.jsx" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.env" . | grep -v node_modules | grep -v ".env.example"; then
            echo "❌ Potential secrets found in code!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"
      - name: Check .env not committed
        run: |
          if git ls-files | grep -qE "(^|/)\.env$|\.env\.(local|production)$"; then
            echo "❌ .env file is committed!"
            exit 1
          fi
          echo "✅ .env not in repo"
