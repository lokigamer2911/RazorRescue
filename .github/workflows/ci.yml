name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint, Audit, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --check src/index.js
      - run: node --check src/routes/api.js
      - run: node --check src/services/openrouter.js
      - run: node --check src/services/database.js
      - run: node --check src/services/simulation.js
      - run: node --check src/middleware/security.js

  frontend:
    name: Frontend — Lint, Build, Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx vite build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in code
        run: |
          if grep -r "sk-or-v1\|sk_live\|sk_test\|password\s*=" --include="*.js" --include="*.jsx" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.env" . | grep -v node_modules | grep -v ".env.example" | grep -v ".yml"; then
            echo "❌ Potential secrets found in code!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"
      - name: Check .env not committed
        run: |
          if git ls-files | grep -q "^\.env$"; then
            echo "❌ .env file is committed!"
            exit 1
          fi
          echo "✅ .env not in repo"
