services:
  - type: web
    name: razorrescue-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Comma-separated browser origins allowed to call this API.
      # Code default already includes https://razorrescue.vercel.app + localhost dev ports.
      - key: ALLOWED_ORIGINS
        sync: false
